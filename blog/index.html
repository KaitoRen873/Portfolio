<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Modern Blog App</title>

<style>
:root{
  --bg:#0b1020;
  --card:rgba(255,255,255,0.06);
  --text:#e5e7eb;
  --muted:#94a3b8;
  --primary:#38bdf8;
  --danger:#ef4444;
  --border:rgba(255,255,255,0.08);
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family: Arial, sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
}

/* glow background */
.glow{
  position:fixed;
  width:500px;
  height:500px;
  background:radial-gradient(circle,rgba(56,189,248,0.25),transparent 70%);
  filter:blur(60px);
  z-index:-1;
  animation:float 8s ease-in-out infinite;
}

.glow2{
  bottom:0;
  right:0;
  animation-delay:2s;
}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(40px)}
}

header{
  text-align:center;
  padding:30px 20px;
}

header h1{
  font-size:2.2rem;
  letter-spacing:1px;
}

header p{
  color:var(--muted);
  margin-top:5px;
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}

/* input section */
.card{
  background:var(--card);
  border:1px solid var(--border);
  backdrop-filter: blur(10px);
  padding:20px;
  border-radius:15px;
  margin-bottom:20px;
  transition:0.3s;
}

.card:hover{
  transform:translateY(-4px);
  border-color:var(--primary);
}

input,textarea{
  width:100%;
  padding:12px;
  margin-top:10px;
  margin-bottom:10px;
  border-radius:10px;
  border:1px solid var(--border);
  background:rgba(0,0,0,0.3);
  color:white;
  outline:none;
}

button{
  padding:10px 16px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
  transition:0.3s;
}

.btn-primary{
  background:var(--primary);
  color:black;
}

.btn-primary:hover{
  background:#0ea5e9;
}

.post{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:15px;
  padding:15px;
  margin-bottom:15px;
  transition:0.3s;
}

.post:hover{
  transform:scale(1.02);
  border-color:var(--primary);
}

.post h3{
  margin-bottom:5px;
}

.post small{
  color:var(--muted);
}

.delete{
  margin-top:10px;
  background:var(--danger);
  color:white;
}

.delete:hover{
  background:#dc2626;
}
</style>
</head>

<body>

<div class="glow"></div>
<div class="glow glow2"></div>

<header>
  <h1>Modern Blog</h1>
  <p>Create and manage posts easily</p>
</header>

<div class="container">

  <!-- CREATE POST -->
  <div class="card">
    <h2>Create New Post</h2>

    <input id="title" placeholder="Enter title"/>
    <textarea id="content" rows="4" placeholder="Write your blog post..."></textarea>

    <button class="btn-primary" onclick="addPost()">Publish</button>
  </div>

  <!-- POSTS -->
  <div id="posts"></div>

</div>

<script>
let posts = JSON.parse(localStorage.getItem("posts")) || [];

function renderPosts(){
  const container = document.getElementById("posts");
  container.innerHTML = "";

  posts.forEach((post, i)=>{
    container.innerHTML += `
      <div class="post">
        <h3>${post.title}</h3>
        <small>${post.date}</small>
        <p style="margin-top:10px;color:#cbd5e1;">${post.content}</p>
        <button class="delete" onclick="deletePost(${i})">Delete</button>
      </div>
    `;
  });

  localStorage.setItem("posts", JSON.stringify(posts));
}

function addPost(){
  const title = document.getElementById("title").value;
  const content = document.getElementById("content").value;

  if(!title || !content){
    alert("Fill all fields");
    return;
  }

  posts.unshift({
    title,
    content,
    date: new Date().toLocaleString()
  });

  document.getElementById("title").value = "";
  document.getElementById("content").value = "";

  renderPosts();
}

function deletePost(i){
  posts.splice(i,1);
  renderPosts();
}

renderPosts();
</script>

</body>
</html>
