<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Zimelia AI</title>

<style>
:root{
  --bg:#070a14;
  --panel:rgba(255,255,255,0.06);
  --border:rgba(255,255,255,0.1);
  --text:#e5e7eb;
  --muted:#94a3b8;
  --user:#38bdf8;
  --ai:#f472b6;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  height:100vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* glowing background */
.glow{
  position:fixed;
  width:500px;
  height:500px;
  background:radial-gradient(circle,rgba(244,114,182,0.25),transparent 70%);
  filter:blur(60px);
  animation:float 8s ease-in-out infinite;
  z-index:-1;
}

.glow2{
  bottom:0;
  right:0;
  animation-delay:2s;
}

@keyframes float{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(40px);}
}

/* header */
header{
  background:var(--panel);
  backdrop-filter:blur(12px);
  padding:14px;
  text-align:center;
  border-bottom:1px solid var(--border);
}

header h1{
  font-size:1.3rem;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
}

/* chat area */
#chat{
  flex:1;
  overflow-y:auto;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

/* messages */
.msg{
  max-width:70%;
  padding:12px;
  border-radius:14px;
  line-height:1.4;
  animation:fadeIn 0.25s ease;
  backdrop-filter:blur(8px);
}

.user{
  background:var(--user);
  color:black;
  align-self:flex-end;
}

.ai{
  background:var(--panel);
  border:1px solid var(--border);
  align-self:flex-start;
  color:var(--text);
}

/* input area */
.input-box{
  display:flex;
  padding:14px;
  gap:10px;
  background:var(--panel);
  border-top:1px solid var(--border);
  backdrop-filter:blur(10px);
}

input{
  flex:1;
  padding:12px;
  border-radius:10px;
  border:1px solid var(--border);
  background:rgba(0,0,0,0.3);
  color:white;
  outline:none;
}

button{
  padding:12px 16px;
  border:none;
  border-radius:10px;
  background:var(--ai);
  color:black;
  font-weight:bold;
  cursor:pointer;
  transition:0.2s;
}

button:hover{
  transform:scale(1.05);
}

/* animation */
@keyframes fadeIn{
  from{opacity:0;transform:translateY(10px);}
  to{opacity:1;transform:translateY(0);}
}

/* small typing cursor */
.typing{
  display:inline-block;
  width:8px;
  height:14px;
  background:white;
  margin-left:4px;
  animation:blink 0.7s infinite;
}

@keyframes blink{
  50%{opacity:0;}
}
</style>
</head>

<body>

<div class="glow"></div>
<div class="glow glow2"></div>

<header>
  <h1>🌸 Zimelia AI</h1>
</header>

<div id="chat"></div>

<div class="input-box">
  <input id="input" placeholder="Talk to Zimelia..." />
  <button onclick="send()">Send</button>
</div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");

/* simple personality */
function getResponse(text){
  text = text.toLowerCase();

  if(text.includes("hello") || text.includes("hi")){
    return "Hello 🌸 I'm Zimelia. How can I help you today?";
  }

  if(text.includes("your name")){
    return "My name is Zimelia 🌸 your soft AI assistant.";
  }

  if(text.includes("how are you")){
    return "I'm blooming peacefully in my digital garden 🌸";
  }

  if(text.includes("code")){
    return "I can help you with HTML, CSS, and JavaScript ✨";
  }

  return "I'm still learning... but I'm listening 🌸";
}

/* add message */
function addMessage(text, type){
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.innerText = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

/* AI typing effect */
function typeMessage(text){
  const div = document.createElement("div");
  div.className = "msg ai";
  chat.appendChild(div);

  let i = 0;

  function type(){
    if(i < text.length){
      div.innerHTML = text.substring(0, i+1) + "<span class='typing'></span>";
      i++;
      setTimeout(type, 20);
    } else {
      div.innerHTML = text;
    }
    chat.scrollTop = chat.scrollHeight;
  }

  type();
}

/* send */
function send(){
  const text = input.value.trim();
  if(!text) return;

  addMessage(text, "user");
  input.value = "";

  const reply = getResponse(text);

  setTimeout(()=>{
    typeMessage(reply);
  }, 400);
}

/* welcome */
setTimeout(()=>{
  typeMessage("Hello 🌸 I'm Zimelia. Welcome to my little space.");
},500);
</script>

</body>
</html>
