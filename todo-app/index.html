<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do App</title>

<style>
body{
  font-family:Arial;
  background:#0f172a;
  color:white;
  display:flex;
  justify-content:center;
  padding:40px;
}

.container{
  width:420px;
}

h2{
  text-align:center;
  margin-bottom:15px;
}

input{
  width:100%;
  padding:12px;
  border:none;
  border-radius:8px;
  margin-bottom:10px;
  outline:none;
}

button{
  padding:12px;
  width:100%;
  background:#38bdf8;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
  transition:0.2s;
}

button:hover{
  background:#0ea5e9;
}

.task{
  background:#1e293b;
  margin-top:10px;
  padding:12px;
  border-radius:8px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.task button{
  width:auto;
  padding:6px 10px;
  background:#ef4444;
}

.task button:hover{
  background:#dc2626;
}

.done{
  text-decoration:line-through;
  opacity:0.6;
}
</style>
</head>

<body>

<div class="container">
  <h2>🧾 To-Do App</h2>

  <input id="taskInput" placeholder="Enter task...">
  <button onclick="addTask()">Add Task</button>

  <div id="list"></div>
</div>

<script>
let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

function render(){
  const list = document.getElementById("list");
  list.innerHTML = "";

  tasks.forEach((t, i)=>{
    list.innerHTML += `
      <div class="task">
        <span onclick="toggle(${i})" class="${t.done ? 'done' : ''}">
          ${t.text}
        </span>
        <button onclick="del(${i})">X</button>
      </div>
    `;
  });

  localStorage.setItem("tasks", JSON.stringify(tasks));
}

function addTask(){
  const input = document.getElementById("taskInput");
  const value = input.value.trim();

  if(!value) return;

  tasks.unshift({
    text:value,
    done:false
  });

  input.value = "";
  render();
}

function del(i){
  tasks.splice(i,1);
  render();
}

function toggle(i){
  tasks[i].done = !tasks[i].done;
  render();
}

render();
</script>

</body>
</html>
