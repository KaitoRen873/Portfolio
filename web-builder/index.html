<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Website Builder</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background: radial-gradient(circle at top,#0f172a,#020617);
  color:white;
  display:flex;
  height:100vh;
}

/* LEFT PANEL */
.left{
  width:320px;
  padding:25px;
  background:rgba(17,24,39,0.8);
  backdrop-filter: blur(10px);
  border-right:1px solid rgba(255,255,255,0.08);
}

h2{
  margin-bottom:15px;
}

input, select{
  width:100%;
  padding:12px;
  margin-bottom:12px;
  border:none;
  border-radius:8px;
  outline:none;
  background:#0b1220;
  color:white;
  transition:0.2s;
}

input:focus, select:focus{
  border:1px solid #38bdf8;
}

button{
  width:100%;
  padding:12px;
  background:linear-gradient(135deg,#38bdf8,#6366f1);
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
  color:white;
  transition:0.2s;
}

button:hover{
  transform:scale(1.03);
}

/* PREVIEW AREA */
.preview{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

/* WEBSITE CARD */
.site{
  width:90%;
  max-width:600px;
  padding:40px;
  border-radius:16px;
  transition:0.4s;
  box-shadow:0 20px 60px rgba(0,0,0,0.5);
  border:1px solid rgba(255,255,255,0.08);
}

.site h1{
  margin:0;
  font-size:2rem;
}

.site p{
  opacity:0.7;
}

/* STYLES */
.style1{
  background:rgba(30,41,59,0.9);
}

.style2{
  background:rgba(17,24,39,0.9);
  border:1px solid #38bdf8;
}

.style3{
  background:linear-gradient(135deg,#0ea5e9,#8b5cf6);
}

/* BUTTON INSIDE PREVIEW */
.preview-btn{
  margin-top:15px;
  padding:10px 15px;
  border:none;
  border-radius:8px;
  background:black;
  color:white;
  cursor:pointer;
  transition:0.2s;
}

.preview-btn:hover{
  opacity:0.8;
}
</style>
</head>

<body>

<div class="left">
  <h2>⚡ Website Builder</h2>

  <input id="name" placeholder="Business name">

  <select id="style">
    <option value="style1">Dark Simple</option>
    <option value="style2">Neon Outline</option>
    <option value="style3">Gradient Pro</option>
  </select>

  <button onclick="generate()">Generate Website</button>
</div>

<div class="preview">
  <div class="site style1" id="site">
    <h1>My Business</h1>
    <p>Instant website preview generator</p>
  </div>
</div>

<script>
function generate(){
  const name = document.getElementById("name").value || "My Business";
  const style = document.getElementById("style").value;

  const site = document.getElementById("site");

  site.className = "site " + style;

  site.innerHTML = `
    <h1>${name}</h1>
    <p>Professional landing page preview generated instantly.</p>
    <button class="preview-btn">Contact Developer</button>
  `;
}
</script>

</body>
</html>
